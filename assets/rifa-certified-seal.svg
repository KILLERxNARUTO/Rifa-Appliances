<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130">
  <defs>
    <!-- Circular Path for Top Text: RIFA APPLIANCES -->
    <path id="textCircleTop" d="M 18,65 A 47,47 0 1,1 112,65" fill="none" />
    <!-- Circular Path for Bottom Text: CERTIFIED STANDARDS -->
    <path id="textCircleBottom" d="M 112,65 A 47,47 0 0,1 18,65" fill="none" />
  </defs>

  <!-- Outer Ring with Double Borders -->
  <circle cx="65" cy="65" r="62.5" fill="none" stroke="#ff7043" stroke-width="2.5" />
  <circle cx="65" cy="65" r="58.5" fill="none" stroke="#ff7043" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="65" cy="65" r="35" fill="none" stroke="#ff7043" stroke-width="1.8" />

  <!-- Top Arc Text: RIFA APPLIANCES -->
  <text font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.8" font-weight="800" fill="#ff7043" letter-spacing="2.8">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      RIFA APPLIANCES
    </textPath>
  </text>

  <!-- Bottom Arc Text: CERTIFIED STANDARDS -->
  <text font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.8" font-weight="700" fill="#ff7043" letter-spacing="2.2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      CERTIFIED STANDARDS
    </textPath>
  </text>

  <!-- Side Star Embellishments -->
  <g fill="#ff7043">
    <!-- Left Star -->
    <polygon points="17.5,65 19.5,62.5 22.5,62.5 20,64.5 21,67.5 18.5,66 16,67.5 17,64.5 14.5,62.5 17.5,62.5" transform="scale(0.8) translate(3, 14)" />
    <!-- Right Star -->
    <polygon points="17.5,65 19.5,62.5 22.5,62.5 20,64.5 21,67.5 18.5,66 16,67.5 17,64.5 14.5,62.5 17.5,62.5" transform="scale(0.8) translate(132, 14)" />
  </g>

  <!-- Center Emblem: Certified Appliance Shield & Monogram -->
  <g transform="translate(65, 65)">
    <!-- Central Shield -->
    <path d="M 0,-19 L 14,-12 C 14,3 9,14 0,19 C -9,14 -14,3 -14,-12 Z" fill="#ff7043" opacity="0.12" stroke="#ff7043" stroke-width="1.8" />
    
    <!-- Stylized Checkmark / Swoosh of Quality -->
    <path d="M -7,-1 L -2,4 L 8,-6" fill="none" stroke="#ff7043" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stars below checkmark -->
    <circle cx="-5" cy="10" r="1.3" fill="#ff7043" />
    <circle cx="0" cy="12" r="1.6" fill="#ff7043" />
    <circle cx="5" cy="10" r="1.3" fill="#ff7043" />
  </g>
</svg>
